name: profile-cards

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # the action runs `git push` on whatever branch is in the workspace, NOT
      # on BRANCH_NAME: so the output branch must be checked out directly, or
      # the cards land on main. Without a checkout at all it fails (exit 128).
      - uses: actions/checkout@v4
        with:
          ref: profile-summary-cards-output

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # GITHUB_TOKEN only sees public repos, so the language cards under-count
          # the private ones. Add a classic PAT (scopes: repo, read:user) as the
          # CARDS_TOKEN secret and private repos start counting — no edit needed.
          GITHUB_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: profile-summary-cards-output
          THEME: tokyonight          # without this it generates all ~50 themes
          ANIMATION: rise
          NAME: Federico Fassio
          UTC_OFFSET: 2
