name: snake

on:
  schedule:
    # 05:00 UTC, ~1h dopo il commit di `daily` cosi' il serpente lo vede gia'
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Genera l'animazione dal contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      # le SVG finiscono su un branch dedicato `output`, non su main:
      # il README le linka via raw.githubusercontent.com
      - name: Pubblica sul branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
