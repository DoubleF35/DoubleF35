name: profile-cards

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # l'action fa `git push` sul branch che trova nel workspace, NON su
      # BRANCH_NAME: va quindi checkoutato direttamente il branch di output,
      # altrimenti le card finiscono su main. Senza checkout fallisce (exit 128).
      - uses: actions/checkout@v4
        with:
          ref: profile-summary-cards-output

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: profile-summary-cards-output
          THEME: tokyonight          # senza questo genera tutti i ~50 temi
          ANIMATION: rise
          NAME: Federico Fassio
          UTC_OFFSET: 2
