name: profile-cards

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # senza checkout l'action non ha un repo git in cui committare (exit 128)
      - uses: actions/checkout@v4

      # genera le card come SVG e le committa su un branch dedicato, cosi' il
      # README non dipende da un servizio esterno che puo' andare giu' e `main`
      # resta pulito (README + workflow, niente altro)
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: profile-summary-cards-output
          THEME: tokyonight          # senza questo genera tutti i ~50 temi
          ANIMATION: rise
          NAME: Federico Fassio
          UTC_OFFSET: 2
